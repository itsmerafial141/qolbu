plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.coderaf.qolbu"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.coderaf.qolbu"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
    
    flavorDimensions "flavors"
    productFlavors {
        development {
            dimension "flavors"
            applicationIdSuffix ".dev"
            buildConfigField("String", "FLAVOR_CONFIGURATION", '"development"')
            resValue "string", "app_name", "Qolbu Development"
        }
        staging {
            dimension "flavors"
            applicationIdSuffix ".qa"
            buildConfigField("String", "FLAVOR_CONFIGURATION", '"staging"')
            resValue "string", "app_name", "Qolbu Staging"
        }
        production {
            dimension "flavors"
            buildConfigField("String", "FLAVOR_CONFIGURATION", '"production"')
            resValue "string", "app_name", "Qolbu"
        }
    }
}

flutter {
    source = "../.."
}
